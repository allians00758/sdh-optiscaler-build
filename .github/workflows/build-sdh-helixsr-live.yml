name: Build SDH HelixSR-Scaler 2.3.1 Live API v2 (Windows x64)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-sdh-helixsr-live.yml
      - scripts/patch_helixsr_live231.py
      - scripts/patch_helixsr_upscalers231.py
      - scripts/verify_helixsr_live231.py
      - scripts/patch_optiscaler_plugin_api.py
      - scripts/sdh_plugin_api_extension.inc
      - scripts/verify_integration.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout official HelixSR-Scaler 2.3.1 sources
        run: |
          $ErrorActionPreference='Stop'
          git clone --depth 1 --branch v2.3.1 https://github.com/lonewolf0622/HelixSR-Scaler.git upstream
          if ($LASTEXITCODE -ne 0) { throw "Cannot clone HelixSR-Scaler" }
          $pin="c022c8d024c8177d3799ba1bb51dabcf0100d854"
          $actual=(git -C upstream rev-parse HEAD).Trim()
          if ($actual -ne $pin) { throw "Source tag changed: $actual" }
          git -C upstream submodule update --init --recursive --depth 1
          if ($LASTEXITCODE -ne 0) { throw "Submodule checkout failed" }

      - name: Apply original SDH Live API v2 and HelixSR 2.3.1 adaptation
        run: |
          python scripts/run_base_helixsr231.py upstream
          if ($LASTEXITCODE -ne 0) { throw "Base SDH Live patch failed" }
          python scripts/patch_helixsr_live231.py upstream
          if ($LASTEXITCODE -ne 0) { throw "HelixSR FG adaptation failed" }
          python scripts/patch_helixsr_upscalers231.py upstream
          if ($LASTEXITCODE -ne 0) { throw "HelixSR adaptation failed" }
          python scripts/verify_helixsr_live231.py upstream
          if ($LASTEXITCODE -ne 0) { throw "SDH v2 source verification failed" }

      - uses: microsoft/setup-msbuild@v2

      - name: Build Windows x64 DLL
        working-directory: upstream
        run: |
          msbuild .\OptiScaler.sln /m:2 /p:Configuration=Release /p:Platform=x64 /verbosity:minimal "/flp:errorsonly;logfile=build-errors.log"
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed" }

      - name: Inspect PE and stage independent DLL archive
        run: |
          $ErrorActionPreference='Stop'
          $dll="upstream/x64/Release/a/OptiScaler.dll"
          if (!(Test-Path -LiteralPath $dll)) { throw "Missing DLL: $dll" }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -LiteralPath $dll -Destination out/dxgi.dll
          @'
          import pathlib, struct
          p=pathlib.Path("out/dxgi.dll"); b=p.read_bytes()
          assert len(b)>1024*1024 and b[:2]==b"MZ", "Invalid PE"
          off=struct.unpack_from("<I",b,0x3c)[0]
          assert b[off:off+4]==b"PE\0\0" and struct.unpack_from("<H",b,off+4)[0]==0x8664, "Not Windows x64"
          print("PE Windows x64 PASS, bytes",len(b))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Invalid DLL output" }
          @"
          SDH HelixSR-Scaler 2.3.1 Live API v2
          Source: https://github.com/lonewolf0622/HelixSR-Scaler/releases/tag/v2.3.1
          Pinned commit: c022c8d024c8177d3799ba1bb51dabcf0100d854
          Target: Windows x64 / unsigned test DLL (dxgi.dll)
          Standalone build, NOT bundled in SDH FrameGen.
          Companion: use current sdh-optiscaler-control.asi, do not overwrite it.
          Live multiplier command: has_helix_multiplier=1, helix_multiplier=0|2|3|4|5|6
          Note: live config update is not proof a frame was actually generated; validate in game.
          "@ | Set-Content -LiteralPath out/BUILD-INFO.txt
          Get-FileHash -Algorithm SHA256 out/dxgi.dll | Format-List | Out-String | Add-Content out/BUILD-INFO.txt

      - name: Upload separate compiled DLL
        uses: actions/upload-artifact@v4
        with:
          name: SDH-HelixSR-Scaler-2.3.1-LiveAPI-v2
          path: out/
          if-no-files-found: error
          retention-days: 14

      - name: Show compiler errors
        if: failure()
        run: |
          if (Test-Path 'upstream/build-errors.log') {
            Get-Content 'upstream/build-errors.log' | Select-Object -First 70
          }
